services:
  keycloak-standard:
    container_name: keycloak-standard
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - standard
    command:
      - "start-dev"
networks:
  standard:
    driver: bridge

volumes:
  keycloak:
    driver: local
