services:
  ng-proxy-standard:
    image: nginx:latest
    container_name: ng-proxy-standard
    ports:
      - "8080:80" # Map port 80 on the host to port 80 in the container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Mount your custom nginx.conf file
    command: ["nginx", "-g", "daemon off;"] # Ensure nginx runs in the foreground for Docker
