http {

    include mime.types;

    set_real_ip_from  0.0.0.0/0;
    real_ip_recursive on;
    real_ip_header    X-Forward-For;
    limit_req_zone    $binary_remote_addr zone=apilimit:10m rate=10r/s;

    upstream standardapi {
        server host.docker.internal:8000;
    }

    server {
        listen 80;
        server_name localhost;
        root /proxy;

        # Limit request rate
        limit_req zone=apilimit burst=40 nodelay;

        location / {
            proxy_pass                 http://standardapi;
            proxy_http_version         1.1;
            proxy_set_header           Upgrade $http_upgrade;
            proxy_set_header           Connection 'upgrade';
            proxy_set_header           Host $host;
            proxy_cache_bypass         $http_upgrade;
            proxy_pass_request_headers on;

            # Forward the CSRF token header
            proxy_set_header           X-CSRF-TOKEN $http_x_csrf_token;

            # Forward the CSRF parameter if it exists
            proxy_set_header           _csrf $arg__csrf;

            # CORS headers
            add_header Access-Control-Allow-Origin "http://localhost:4200";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-CSRF-TOKEN, _csrf";
            add_header Access-Control-Allow-Credentials true;

            # Preflight request handling
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "http://localhost:4200";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-CSRF-TOKEN, _csrf";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }
}

events {}
