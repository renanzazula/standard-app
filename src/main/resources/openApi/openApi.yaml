          type: integer
          format: int32
        unitValue:
          type: number
          format: double
        Product:
          $ref: '#/components/schemas/Product'
        data:
          type: string
          format: date-time
        hora:
          type: string
          format: date-time
        productHasItemsTypeMeasure:
          $ref: '#/components/schemas/ProductHasItemsTypeMeasure'
        itemsTypeMeasure:
          $ref: '#/components/schemas/ItemsTypeMeasure'
