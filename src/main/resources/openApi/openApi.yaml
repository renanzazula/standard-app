      summary: Save a new subcategory
      description: save and returns a new subcategory if successful.
      tags:
        - SubcategoryController
      operationId: saveSubcategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subcategory'
      responses:
        '200':
          description: Successful save a new subcategory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '400':
          description: Bad request (e.g., missing or invalid fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: find all Subcategories
      description: return all the Subcategories
      operationId: findAllSubcategories
      tags:
        - SubcategoryController
      responses:
        '200':
          description: return all the Subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subcategory'
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /private/api/v1/subcategory/{id}:
    get:
      summary: find by id
      description: return subcategory if is exist
      operationId: findSubcategoryById
      tags:
        - SubcategoryController
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: abc123
          description: The ID Subcategory
      responses:
        '200':
          description: return a brands if exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /private/api/v1/subcategory/category/{id}":
    get:
      summary: find Subcategories by category
      description: return all the subcategory bt category
      operationId: findSubCategoryByCategory
      tags:
        - SubcategoryController
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: abc123
          description: The ID Provider
      responses:
        '200':
          description: return all the subcategory bt category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subcategory'
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: delete subcategory by id
      description: return status 200
      operationId: deleteSubcategoryById
      tags:
        - SubcategoryController
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: abc123
          description: The ID Subcategory
      responses:
        '200':
          description: delete has been successfully executed
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: return updated subcategory
      description: return updated subcategory
      operationId: updateSubcategory
      tags:
        - SubcategoryController
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: abc123
          description: The ID Subcategory
      requestBody:
        description: Subcategory to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subcategory'
      responses:
        '200':
          description: update has been successfully executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subcategory'
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

