openapi: 3.0.3
info:
  title: Standard API
  version: 1.0.0
tags:
  - name: Domain
  - name: Pos
  - name: PayBack
  - name: Withdrawal
  - name: Customer
  - name: OrderHasProduct
  - name: Product
  - name: Provider
  - name: Order
  - name: Measure
  - name: Category
  - name: Subcategory
  - name: Brand
  - name: PaymentMethod
  - name: OrderHasItemProduct
  - name: ProductHasItemsTypeMeasure
  - name: ItemsTypeMeasure
  - name: Error
  - name: ErrorDetails
paths:
  /private/api/v1/brand:
    post:
      summary: Save a new brand
      description: save and returns a new brand if successful.
      tags:
        - BrandController
      operationId: save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brand'
      responses:
        '200':
          description: Successful save a new brand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: Bad request (e.g., missing or invalid fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: find all brands
      description: return all the brands
      operationId: findAll
      tags:
        - BrandController
      responses:
        '200':
          description: Successful save a new brand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /private/api/v1/brand/{id}:
    get:
      summary: find by id
      description: return brand if is exist
      operationId: findById
      tags:
        - BrandController
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: abc123
          description: The ID Brand
      responses:
        '200':
          description: return a brands if exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: delete brand by id
      description: return status 200
      operationId: delete
      tags:
        - BrandController
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: abc123
          description: The ID Brand
      responses:
        '200':
          description: delete has been successfully executed
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: return brand updated brand
      description: return brand updated brand
      operationId: update
      tags:
        - BrandController
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: abc123
          description: The ID Brand
      requestBody:
        description: Brand to be update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brand'
      responses:
        '200':
          description: update has been successfully executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: Bad request (e.g., invalid role)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (e.g., invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Domain:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        checked:
          type: boolean
        data:
          type: string
          format: date
        hora:
          type: string
          format: date-time
        status:
          type: string
    Pos:
      type: object
      properties:
        id:
          type: integer
          format: int64
        openDate:
          type: string
          format: date
        openTime:
          type: string
          format: date-time
        closeDate:
          type: string
          format: date
        closeTime:
          type: string
          format: date-time
        openAmount:
          type: number
          format: double
        closeAmount:
          type: number
          format: double
        total:
          type: number
          format: double
        totalOrders:
          type: number
          format: double
        totalDiscount:
          type: number
          format: double
        status:
          type: string
    PayBack:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        data:
          type: string
          format: date
        hora:
          type: string
          format: date-time
        valor:
          type: number
          format: double
        pos:
          $ref: '#/components/schemas/Pos'
        customer:
          $ref: '#/components/schemas/Customer'
    Withdrawal:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        creationDate:
          type: string
          format: date-time
        creationTime:
          type: string
          format: date-time
        amount:
          type: number
          format: double
        pos:
          $ref: '#/components/schemas/Pos'
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int64
    OrderHasProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order:
          $ref: '#/components/schemas/Order'
        product:
          $ref: '#/components/schemas/Product'
        unitValue:
          type: number
        quantity:
          type: integer
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        barCode:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        price:
          type: number
          format: double
        salePrice:
          type: number
          format: double
        costPrice:
          type: number
          format: double
        discountPrice:
          type: number
          format: double
        discount:
          type: number
          format: double
        weight:
          type: number
          format: double
        percent:
          type: integer
        discountPercent:
          type: integer
        totalStockQuantity:
          type: integer
        creationDateTime:
          type: string
          format: date-time
        provider:
          $ref: '#/components/schemas/Provider'
        measure:
          $ref: '#/components/schemas/Measure'
        category:
          $ref: '#/components/schemas/Category'
        subcategory:
          $ref: '#/components/schemas/Subcategory'
        brand:
          $ref: '#/components/schemas/Brand'
        productHasItemsTypeMeasure:
          type: array
          items:
            $ref: '#/components/schemas/ProductHasItemsTypeMeasure'
        domains:
          type: array
          items:
            type: string
    Provider:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
        data:
          type: string
          format: date
        hora:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        creationDate:
          type: string
          format: date-time
        creationTime:
          type: string
          format: date-time
        totalAmount:
          type: number
          format: double
        quantity:
          type: integer
        subTotal:
          type: number
          format: double
        pendingAmount:
          type: number
          format: double
        paidAmount:
          type: number
          format: double
        discount:
          type: number
          format: double
        totalAmountToPaid:
          type: number
          format: double
        change:
          type: number
          format: double
        payment:
          type: number
          format: double
        status:
          type: string
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        pos:
          $ref: '#/components/schemas/Pos'
        customer:
          $ref: '#/components/schemas/Customer'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        measure:
          $ref: '#/components/schemas/Measure'
        category:
          $ref: '#/components/schemas/Category'
        subcategory:
          $ref: '#/components/schemas/Subcategory'
        brand:
          $ref: '#/components/schemas/Brand'
        orderHasItemProduct:
          type: array
          items:
            $ref: '#/components/schemas/OrderHasItemProduct'
    Measure:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
        date:
          type: string
          format: date
        hora:
          type: string
          format: time
        category:
          $ref: "#/components/schemas/Category"
        subcategory:
          $ref: "#/components/schemas/Subcategory"
        brand:
          $ref: "#/components/schemas/Brand"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/Subcategory"
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
        itemsTypeMeasure:
          type: array
          items:
            $ref: "#/components/schemas/ItemsTypeMeasure"
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
        subcategories:
          type: array
