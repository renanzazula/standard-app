      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: string
        measure:
          $ref: '#/components/schemas/Measure'
        brand:
          $ref: '#/components/schemas/Brand'
        category:
          $ref: '#/components/schemas/Category'
        subcategory:
          $ref: '#/components/schemas/Subcategory'
    Error:
      type: object
      properties:
        target:
          type: string
        message:
          type: string
        reference:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetails"
    ErrorDetails:
      type: object
      properties:
        target:
          type: string
        code:
          type: string
        message:
          type: string
